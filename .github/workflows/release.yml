name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Validate tag matches package version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match package version v$version"
          }

      - name: Ensure FFmpeg
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
          }
          ffmpeg -version | Select-Object -First 1
          ffprobe -version | Select-Object -First 1

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build Windows release assets
        run: npm run package:win

      - name: Create or update GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $repo = "${{ github.repository }}"

          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $repo --title $tag --generate-notes
          }

          Get-ChildItem release -File | Where-Object {
            $_.Name -eq 'latest.yml' -or
            $_.Name -like 'ffmpeg-freeze-trimmer-setup-*.exe' -or
            $_.Name -like 'ffmpeg-freeze-trimmer-setup-*.exe.blockmap'
          } | ForEach-Object {
            gh release upload $tag $_.FullName --repo $repo --clobber
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to upload $($_.Name)"
            }
          }
